# Shared 24-bit color palette for vim (colors/plain256.vim) and tmux
#
# Stored as tmux user options (#{@NAME}): tmux expands $VARS while parsing a
# file, before source-file runs, so plain variables can't be shared this way.
# Values must stay double-quoted: an unquoted # starts a comment in tmux

# Greys
set-option -g @GREY_00 "#000000"
set-option -g @GREY_12 "#121212"
set-option -g @GREY_1C "#1c1c1c"
set-option -g @GREY_26 "#262626"
set-option -g @GREY_3A "#3a3a3a"
set-option -g @GREY_44 "#444444"
set-option -g @GREY_4E "#4e4e4e"
set-option -g @GREY_58 "#585858"
set-option -g @GREY_6C "#6c6c6c"
set-option -g @GREY_76 "#767676"
set-option -g @GREY_80 "#808080"
set-option -g @GREY_8A "#8a8a8a"
set-option -g @GREY_94 "#949494"
set-option -g @GREY_9E "#9e9e9e"
set-option -g @GREY_AF "#afafaf"
set-option -g @GREY_BC "#bcbcbc"
set-option -g @GREY_DA "#dadada"
set-option -g @GREY_EE "#eeeeee"
set-option -g @GREY_FF "#ffffff"

# Reds
set-option -g @MAROON "#5f0000"
set-option -g @RED_DARK "#870000"
set-option -g @RED_DEEP "#af0000"
set-option -g @RED "#d70000"
set-option -g @RED_BRIGHT "#ff0000"
set-option -g @RED_MUTED "#af5f5f"
set-option -g @ROSE_DUSTY "#af8787"

# Oranges
set-option -g @ORANGE_RED "#dd4010"
set-option -g @ORANGE_DARK "#d75f00"
set-option -g @ORANGE_BRIGHT "#ff5f00"
set-option -g @ORANGE "#d78700"
set-option -g @ORANGE_LIGHT "#ff8700"
set-option -g @SALMON "#d7875f"
set-option -g @SALMON_BRIGHT "#ff875f"
set-option -g @PEACH "#ffaf5f"
set-option -g @AMBER "#ffaf00"

# Browns
set-option -g @BROWN_DARK "#875f00"
set-option -g @BROWN "#af5f00"
set-option -g @TAN "#af875f"
set-option -g @TAN_LIGHT "#d7af87"

# Yellows
set-option -g @GOLD "#d7af5f"
set-option -g @GOLD_BRIGHT "#ffd700"
set-option -g @YELLOW_WARM "#ffd75f"
set-option -g @YELLOW "#ffff5f"
set-option -g @OLIVE "#afaf5f"
set-option -g @KHAKI "#d7d787"
set-option -g @BEIGE "#d7d7af"

# Greens
set-option -g @GREEN_DARK "#005f00"
set-option -g @GREEN_MUTED "#5f875f"
set-option -g @GREEN_BRIGHT "#87d700"
set-option -g @LIME "#afd75f"
set-option -g @LIME_PALE "#afd787"

# Cyans
set-option -g @TEAL_GREY "#5f8787"
set-option -g @TEAL_PALE "#87afaf"
set-option -g @CYAN_PALE "#afd7d7"

# Blues
set-option -g @BLUE "#005faf"
set-option -g @BLUE_TEAL "#0087af"
set-option -g @BLUE_STEEL "#5f87af"
set-option -g @BLUE_SKY "#5fafd7"
set-option -g @BLUE_PALE "#89b6e2"
